name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: E2E against latest Stratus and ts-stratus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Replaces the pinned commit for this job only; package.json and the lockfile stay as they are.
      - name: Install ts-stratus from its default branch
        run: |
          npm install --no-save --no-audit --no-fund github:barnowlsnest/ts-stratus
          node -p "'ts-stratus ' + require('./node_modules/.package-lock.json').packages['node_modules/ts-stratus'].resolved"
      - run: npm run typecheck
      - name: Find the latest Stratus release
        id: stratus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo barnowlsnest/stratus --json tagName --jq .tagName)"
          echo "Stratus $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built from source: the published GHCR images are not pullable without a login.
      - name: Build Stratus
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: https://github.com/barnowlsnest/stratus.git#${{ steps.stratus.outputs.tag }}
          file: app.Dockerfile
          load: true
          push: false
          tags: stratus-e2e
          cache-from: type=gha,scope=stratus
          cache-to: type=gha,mode=max,scope=stratus
      - name: Start Stratus
        run: |
          docker run -d --name stratus-scratch -e WAL_DIR=/usr/wal -e HOST=0.0.0.0 -p 127.0.0.1:8001:8000 stratus-e2e
          timeout 30 bash -c 'until (exec 3<>/dev/tcp/127.0.0.1/8001) 2>/dev/null; do sleep 1; done'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Show Stratus logs
        if: failure()
        run: docker logs stratus-scratch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
